<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#91c9f2" />
  <title>Meadowbrook — 3D Village</title>

  <style>
    * { box-sizing: border-box; }

    :root {
      --glass: rgba(14, 29, 36, 0.72);
      --glass-border: rgba(255, 255, 255, 0.15);
      --text: #f5f7ed;
      --muted: #c2d0c8;
      --mint: #b6f2cb;
      --gold: #f4d38b;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #9cccf0;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #viewport {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }

    #viewport canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      outline: none;
    }

    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(8, 24, 31, .18), transparent 24%),
        linear-gradient(0deg, rgba(8, 24, 31, .28), transparent 30%),
        radial-gradient(ellipse at center, transparent 55%, rgba(12, 27, 31, .16));
    }

    #hud {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    .glass {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      box-shadow: 0 14px 38px rgba(9, 20, 22, .18);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .topbar {
      position: absolute;
      top: 20px;
      left: 22px;
      right: 22px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 15px 10px 10px;
      border-radius: 18px;
      pointer-events: auto;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 13px;
      color: #213826;
      font-size: 21px;
      background: linear-gradient(145deg, #d7f3ad, #8dd8a4);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.75);
    }

    .brand-name {
      font-size: 14px;
      line-height: 1.15;
      font-weight: 800;
      letter-spacing: .11em;
    }

    .brand-sub {
      margin-top: 4px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .19em;
      text-transform: uppercase;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-top: 3px;
      padding: 11px 14px;
      border-radius: 999px;
      color: #e8f3e8;
      font-size: 10px;
      font-weight: 750;
      letter-spacing: .12em;
      pointer-events: auto;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #9de6aa;
      box-shadow: 0 0 12px rgba(157, 230, 170, .9);
      animation: pulse 1.8s ease-in-out infinite;
    }

    @keyframes pulse {
      50% { opacity: .45; transform: scale(.8); }
    }

    .controls-card {
      position: absolute;
      top: 88px;
      right: 22px;
      width: 218px;
      padding: 15px;
      border-radius: 18px;
      pointer-events: auto;
    }

    .eyebrow {
      margin-bottom: 11px;
      color: var(--gold);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .control-row {
      display: flex;
      align-items: center;
      gap: 7px;
      margin: 9px 0;
      color: var(--muted);
      font-size: 11px;
    }

    kbd {
      min-width: 23px;
      height: 23px;
      display: inline-grid;
      place-items: center;
      padding: 0 6px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 6px;
      color: #fff;
      background: rgba(255,255,255,.09);
      font-family: inherit;
      font-size: 10px;
      font-weight: 750;
      box-shadow: 0 2px 0 rgba(0,0,0,.2);
    }

    .bottom-left {
      position: absolute;
      bottom: 22px;
      left: 22px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 15px;
      border-radius: 16px;
    }

    .activity-icon {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 11px;
      color: #23412e;
      background: var(--mint);
      font-size: 15px;
    }

    .activity-label {
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .11em;
    }

    .coords {
      margin-top: 4px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .08em;
    }

    .hint {
      position: absolute;
      right: 22px;
      bottom: 23px;
      padding: 11px 14px;
      border-radius: 14px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .04em;
    }

    .hint strong { color: #fff; }

    .loader-card {
      position: absolute;
      z-index: 4;
      left: 50%;
      bottom: 88px;
      display: flex;
      align-items: center;
      gap: 13px;
      width: min(330px, calc(100vw - 34px));
      padding: 14px 16px;
      border-radius: 16px;
      transform: translateX(-50%);
      transition: opacity .5s ease, transform .5s ease;
      pointer-events: none;
    }

    .loader-card.fade {
      opacity: 0;
      transform: translate(-50%, 8px);
    }

    .spinner {
      width: 23px;
      height: 23px;
      flex: 0 0 auto;
      border: 2px solid rgba(255,255,255,.2);
      border-top-color: var(--mint);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .load-copy { flex: 1; min-width: 0; }

    #loadTitle {
      display: block;
      overflow: hidden;
      color: #fff;
      font-size: 11px;
      font-weight: 750;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #loadDetail {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 10px;
    }

    .progress-track {
      height: 3px;
      margin-top: 9px;
      overflow: hidden;
      border-radius: 9px;
      background: rgba(255,255,255,.13);
    }

    #progressBar {
      display: block;
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #83d99a, #f4d38b);
      transition: width .3s ease;
    }

    #touchControls {
      display: none;
      position: fixed;
      z-index: 5;
      left: 16px;
      bottom: 18px;
      align-items: end;
      gap: 16px;
      pointer-events: auto;
      touch-action: none;
      user-select: none;
    }

    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 44px);
      grid-template-rows: repeat(2, 44px);
      gap: 5px;
    }

    .touch-key {
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,.23);
      border-radius: 13px;
      color: #fff;
      background: rgba(18, 35, 38, .72);
      box-shadow: 0 7px 18px rgba(0,0,0,.2);
      font: 750 13px inherit;
      touch-action: none;
    }

    .touch-key.pressed {
      color: #203629;
      background: var(--mint);
      transform: scale(.95);
    }

    .touch-key.up { grid-column: 2; grid-row: 1; }
    .touch-key.left { grid-column: 1; grid-row: 2; }
    .touch-key.down { grid-column: 2; grid-row: 2; }
    .touch-key.right { grid-column: 3; grid-row: 2; }

    .touch-key.sprint {
      width: 62px;
      height: 50px;
      color: #282215;
      background: rgba(244, 211, 139, .92);
      font-size: 9px;
      letter-spacing: .06em;
    }

    @media (pointer: coarse), (max-width: 700px) {
      #touchControls { display: flex; }
      .controls-card { display: none; }
      .hint { display: none; }
      .bottom-left { bottom: 126px; left: 16px; }
      .topbar { top: 13px; left: 14px; right: 14px; }
      .brand { padding: 8px 11px 8px 8px; }
      .brand-mark { width: 36px; height: 36px; }
      .status { padding: 9px 11px; font-size: 9px; }
      .loader-card { bottom: 182px; }
    }

    @media (max-width: 430px) {
      .brand-sub { letter-spacing: .12em; }
      .brand-name { font-size: 12px; }
      .status { max-width: 138px; font-size: 8px; }
      .bottom-left { padding: 10px 12px; }
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>

<body>
  <div id="viewport"></div>
  <div class="vignette"></div>

  <div id="hud">
    <div class="topbar">
      <div class="brand glass">
        <div class="brand-mark">🌾</div>
        <div>
          <div class="brand-name">MEADOWBROOK</div>
          <div class="brand-sub">A little village to explore</div>
        </div>
      </div>

      <div class="status glass">
        <span class="status-dot"></span>
        <span id="worldStatus">BUILDING THE VILLAGE</span>
      </div>
    </div>

    <div class="controls-card glass">
      <div class="eyebrow">How to explore</div>
      <div class="control-row"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd><span>Move</span></div>
      <div class="control-row"><kbd>SHIFT</kbd><span>Sprint</span></div>
      <div class="control-row"><kbd>DRAG</kbd><span>Orbit camera</span></div>
    </div>

    <div class="bottom-left glass">
      <div class="activity-icon">✦</div>
      <div>
        <div class="activity-label" id="activity">READY TO EXPLORE</div>
        <div class="coords" id="coords">VILLAGE SQUARE · 0, 0</div>
      </div>
    </div>

    <div class="hint glass">
      <strong>Tip:</strong> drag the scene to look around
    </div>
  </div>

  <div class="loader-card glass" id="loaderCard">
    <div class="spinner"></div>
    <div class="load-copy">
      <strong id="loadTitle">Loading models from GitHub Raw…</strong>
      <span id="loadDetail">Preparing the village</span>
      <div class="progress-track"><i id="progressBar"></i></div>
    </div>
  </div>

  <div id="touchControls">
    <div class="dpad">
      <button class="touch-key up" data-key="KeyW" aria-label="Move forward">▲</button>
      <button class="touch-key left" data-key="KeyA" aria-label="Move left">◀</button>
      <button class="touch-key down" data-key="KeyS" aria-label="Move backward">▼</button>
      <button class="touch-key right" data-key="KeyD" aria-label="Move right">▶</button>
    </div>
    <button class="touch-key sprint" data-key="ShiftLeft">SPRINT</button>
  </div>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

    // These are direct Raw links to files already present in the repository.
    const ASSETS = {
      character: "https://raw.githubusercontent.com/rafay393/Character-Bundle/main/character/Animated%20Woman%20by%20Quaternius%20-%209kF7eTDbhO.glb",
      barn: "https://raw.githubusercontent.com/rafay393/Character-Bundle/main/Farm%20Buildings%20Bundle-glb/Barn.glb",
      windmill: "https://raw.githubusercontent.com/rafay393/Character-Bundle/main/Farm%20Buildings%20Bundle-glb/Tower%20Windmill.glb",
      tree: "https://raw.githubusercontent.com/rafay393/Character-Bundle/main/Tree-plants-grass/Tree%20by%20Quaternius%20-%20qZtx0AHhcy.glb"
    };

    // If the imported character faces backward, change Math.PI to 0.
    const CHARACTER_YAW_OFFSET = Math.PI;

    const viewport = document.getElementById("viewport");
    const worldStatus = document.getElementById("worldStatus");
    const activityLabel = document.getElementById("activity");
    const coordsLabel = document.getElementById("coords");

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xa9d5f4);
    scene.fog = new THREE.Fog(0xa9d5f4, 62, 155);

    const camera = new THREE.PerspectiveCamera(
      48,
      window.innerWidth / window.innerHeight,
      0.1,
      240
    );
    camera.position.set(0, 7.5, 12);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: "high-performance"
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.12;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.domElement.setAttribute("aria-label", "Interactive 3D village");
    viewport.appendChild(renderer.domElement);

    const hemisphere = new THREE.HemisphereLight(0xdaf0ff, 0x536840, 2.0);
    scene.add(hemisphere);

    const sunlight = new THREE.DirectionalLight(0xfff0d3, 3.0);
    sunlight.position.set(-28, 42, 24);
    sunlight.castShadow = true;
    sunlight.shadow.mapSize.set(2048, 2048);
    sunlight.shadow.camera.left = -52;
    sunlight.shadow.camera.right = 52;
    sunlight.shadow.camera.top = 52;
    sunlight.shadow.camera.bottom = -52;
    sunlight.shadow.camera.near = 1;
    sunlight.shadow.camera.far = 110;
    sunlight.shadow.bias = -0.00035;
    scene.add(sunlight);

    const fillLight = new THREE.DirectionalLight(0xc7e4ff, 0.65);
    fillLight.position.set(22, 18, -25);
    scene.add(fillLight);

    const groundMaterial = new THREE.MeshStandardMaterial({
      color: 0x6cae68,
      roughness: 1
    });
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(190, 190),
      groundMaterial
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.09;
    ground.receiveShadow = true;
    scene.add(ground);

    const roadMaterial = new THREE.MeshStandardMaterial({
      color: 0xcbb78f,
      roughness: 1
    });

    function addBox(parent, width, height, depth, material, x, y, z, cast = true) {
      const object = new THREE.Mesh(
        new THREE.BoxGeometry(width, height, depth),
        material
      );
      object.position.set(x, y, z);
      object.castShadow = cast;
      object.receiveShadow = true;
      parent.add(object);
      return object;
    }

    // Main dirt paths.
    addBox(scene, 5.3, 0.11, 142, roadMaterial, 0, -0.005, 0, false);
    addBox(scene, 78, 0.10, 4.8, roadMaterial, 0, -0.012, 0, false);

    // Soft rolling hills at the edge of the play area.
    const hillMaterial = new THREE.MeshStandardMaterial({
      color: 0x83bd77,
      roughness: 1
    });
    for (let i = 0; i < 13; i++) {
      const angle = (i / 13) * Math.PI * 2;
      const hill = new THREE.Mesh(
        new THREE.SphereGeometry(1, 18, 12),
        hillMaterial
      );
      const radius = 63 + (i % 3) * 5;
      hill.position.set(Math.cos(angle) * radius, -2.3, Math.sin(angle) * radius);
      hill.scale.set(15 + (i % 4) * 3, 8 + (i % 3), 10 + (i % 2) * 4);
      hill.receiveShadow = true;
      scene.add(hill);
    }

    const houseBlockers = [];

    function createHouse(x, z, scale, wallColor, roofColor) {
      const house = new THREE.Group();
      const wall = new THREE.MeshStandardMaterial({
        color: wallColor,
        roughness: 0.88
      });
      const roofMat = new THREE.MeshStandardMaterial({
        color: roofColor,
        roughness: 0.9
      });
      const wood = new THREE.MeshStandardMaterial({
        color: 0x704b32,
        roughness: 0.88
      });
      const trim = new THREE.MeshStandardMaterial({
        color: 0xf3dfb5,
        roughness: 0.82
      });
      const glass = new THREE.MeshStandardMaterial({
        color: 0x8dc5d3,
        roughness: 0.32,
        metalness: 0.05
      });

      addBox(house, 4.9 * scale, 0.18 * scale, 4.1 * scale,
        wood, 0, 0.09 * scale, 0);
      addBox(house, 4.65 * scale, 2.9 * scale, 3.8 * scale,
        wall, 0, 1.53 * scale, 0);

      const roof = new THREE.Mesh(
        new THREE.ConeGeometry(3.35 * scale, 1.95 * scale, 4),
        roofMat
      );
      roof.rotation.y = Math.PI / 4;
      roof.position.y = 3.43 * scale;
      roof.castShadow = true;
      roof.receiveShadow = true;
      house.add(roof);

      // Front door and porch.
      addBox(house, 0.82 * scale, 1.65 * scale, 0.12 * scale,
        wood, 0, 0.89 * scale, 1.97 * scale);
      addBox(house, 1.8 * scale, 0.13 * scale, 1.2 * scale,
        trim, 0, 0.24 * scale, 2.35 * scale);
      addBox(house, 0.12 * scale, 1.05 * scale, 0.12 * scale,
        wood, -0.73 * scale, 0.76 * scale, 2.73 * scale);
      addBox(house, 0.12 * scale, 1.05 * scale, 0.12 * scale,
        wood, 0.73 * scale, 0.76 * scale, 2.73 * scale);

      // Windows.
      for (const side of [-1, 1]) {
        addBox(house, 0.82 * scale, 0.78 * scale, 0.10 * scale,
          trim, side * 1.28 * scale, 1.83 * scale, 1.97 * scale);
        addBox(house, 0.62 * scale, 0.58 * scale, 0.12 * scale,
          glass, side * 1.28 * scale, 1.83 * scale, 2.035 * scale);
        addBox(house, 0.08 * scale, 0.72 * scale, 0.08 * scale,
          wood, side * 1.28 * scale, 1.83 * scale, 2.11 * scale);
        addBox(house, 0.72 * scale, 0.08 * scale, 0.08 * scale,
          wood, side * 1.28 * scale, 1.83 * scale, 2.11 * scale);
      }

      addBox(house, 0.48 * scale, 1.10 * scale, 0.48 * scale,
        roofMat, 1.28 * scale, 3.45 * scale, -0.70 * scale);

      house.position.set(x, 0, z);
      scene.add(house);

      houseBlockers.push({
        x,
        z,
        rx: 2.95 * scale,
        rz: 2.55 * scale
      });

      return house;
    }

    // A ring of small cottages around the square.
    createHouse(-11, -13, 0.93, 0xe8c99b, 0x9d4938);
    createHouse(11, -13, 1.00, 0xe4d1a8, 0x476e75);
    createHouse(-12, 12, 0.92, 0xd9b88b, 0x546f42);
    createHouse(12, 12, 0.94, 0xf0d9ae, 0x9c583e);
    createHouse(-22, 0, 0.84, 0xe8d8bc, 0x6e5140);
    createHouse(22, 0, 0.84, 0xe2c993, 0x697844);

    // Village well.
    function createWell(x, z) {
      const group = new THREE.Group();
      const stone = new THREE.MeshStandardMaterial({ color: 0x8d9384, roughness: 1 });
      const darkStone = new THREE.MeshStandardMaterial({ color: 0x596c64, roughness: 0.95 });
      const timber = new THREE.MeshStandardMaterial({ color: 0x6b4931, roughness: 0.9 });

      const base = new THREE.Mesh(
        new THREE.CylinderGeometry(1.12, 1.28, 0.55, 12),
        stone
      );
      base.position.y = 0.28;
      base.castShadow = true;
      base.receiveShadow = true;
      group.add(base);

      const water = new THREE.Mesh(
        new THREE.CylinderGeometry(0.84, 0.84, 0.06, 16),
        new THREE.MeshStandardMaterial({
          color: 0x4d9a9b,
          roughness: 0.28,
          metalness: 0.12
        })
      );
      water.position.y = 0.55;
      group.add(water);

      const rim = new THREE.Mesh(
        new THREE.TorusGeometry(1.05, 0.12, 7, 18),
        darkStone
      );
      rim.rotation.x = Math.PI / 2;
      rim.position.y = 0.58;
      rim.castShadow = true;
      group.add(rim);

      addBox(group, 0.13, 1.75, 0.13, timber, -0.88, 1.26, 0);
      addBox(group, 0.13, 1.75, 0.13, timber, 0.88, 1.26, 0);

      const roof = new THREE.Mesh(
        new THREE.ConeGeometry(1.35, 0.88, 4),
        timber
      );
      roof.rotation.y = Math.PI / 4;
      roof.position.y = 2.32;
      roof.castShadow = true;
      group.add(roof);

      group.position.set(x, 0, z);
      scene.add(group);
      houseBlockers.push({ x, z, rx: 1.55, rz: 1.55 });
    }

    createWell(-5.5, -6.5);

    function addFenceSegment(x1, z1, x2, z2) {
      const dx = x2 - x1;
      const dz = z2 - z1;
      const length = Math.hypot(dx, dz);
      const angle = Math.atan2(dz, dx);
      const postMaterial = new THREE.MeshStandardMaterial({
        color: 0x77563a,
        roughness: 0.95
      });
      const railMaterial = new THREE.MeshStandardMaterial({
        color: 0x98714a,
        roughness: 0.95
      });

      for (let distance = 0; distance <= length + 0.01; distance += 2.15) {
        const t = Math.min(distance, length);
        const post = new THREE.Mesh(
          new THREE.CylinderGeometry(0.075, 0.10, 0.82, 6),
          postMaterial
        );
        post.position.set(x1 + (dx / length) * t, 0.41, z1 + (dz / length) * t);
        post.castShadow = true;
        post.receiveShadow = true;
        scene.add(post);
      }

      for (const height of [0.32, 0.63]) {
        const rail = new THREE.Mesh(
          new THREE.BoxGeometry(length, 0.11, 0.10),
          railMaterial
        );
        rail.position.set((x1 + x2) / 2, height, (z1 + z2) / 2);
        rail.rotation.y = -angle;
        rail.castShadow = true;
        rail.receiveShadow = true;
        scene.add(rail);
      }
    }

    function createFarmField(cx, cz) {
      const width = 18;
      const depth = 12;
      const soil = new THREE.MeshStandardMaterial({ color: 0x9a8352, roughness: 1 });
      const crops = [
        new THREE.MeshStandardMaterial({ color: 0x729b43, roughness: 1 }),
        new THREE.MeshStandardMaterial({ color: 0x88a94e, roughness: 1 }),
        new THREE.MeshStandardMaterial({ color: 0x587d39, roughness: 1 })
      ];

      addBox(scene, width, 0.05, depth, soil, cx, -0.035, cz, false);

      for (let row = 0; row < 9; row++) {
        const x = cx - 7.6 + row * 1.9;
        addBox(
          scene,
          0.16,
          0.62,
          9.5,
          crops[row % crops.length],
          x,
          0.28,
          cz,
          false
        );
      }

      const left = cx - width / 2;
      const right = cx + width / 2;
      const near = cz - depth / 2;
      const far = cz + depth / 2;
      addFenceSegment(left, near, right, near);
      addFenceSegment(right, near, right, far);
      addFenceSegment(right, far, left, far);
      addFenceSegment(left, far, left, near);
    }

    createFarmField(27, 12);

    // Procedural low-poly trees keep the village full even while GLBs stream in.
    const trunkMaterial = new THREE.MeshStandardMaterial({
      color: 0x795037,
      roughness: 1
    });
    const leafMaterials = [
      new THREE.MeshStandardMaterial({ color: 0x477c49, roughness: 1 }),
      new THREE.MeshStandardMaterial({ color: 0x5e914f, roughness: 1 }),
      new THREE.MeshStandardMaterial({ color: 0x779f52, roughness: 1 })
    ];

    function createTree(x, z, scale = 1, variant = 0) {
      const tree = new THREE.Group();
      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.16, 0.25, 1.65, 7),
        trunkMaterial
      );
      trunk.position.y = 0.82;
      trunk.castShadow = true;
      tree.add(trunk);

      const leaf = leafMaterials[variant % leafMaterials.length];
      const lower = new THREE.Mesh(new THREE.ConeGeometry(1.28, 2.35, 7), leaf);
      lower.position.y = 2.15;
      lower.castShadow = true;
      lower.receiveShadow = true;
      tree.add(lower);

      const middle = new THREE.Mesh(new THREE.ConeGeometry(0.96, 2.05, 7), leaf);
      middle.position.y = 3.15;
      middle.castShadow = true;
      middle.receiveShadow = true;
      tree.add(middle);

      const top = new THREE.Mesh(new THREE.ConeGeometry(0.62, 1.75, 7), leaf);
      top.position.y = 4.05;
      top.castShadow = true;
      top.receiveShadow = true;
      tree.add(top);

      tree.position.set(x, 0, z);
      tree.scale.setScalar(scale);
      scene.add(tree);
    }

    for (let i = 0; i < 30; i++) {
      const angle = i * 2.399;
      const radius = 34 + (i % 5) * 2.2;
      const x = Math.cos(angle) * radius;
      const z = Math.sin(angle) * radius;
      createTree(x, z, 0.78 + (i % 4) * 0.12, i % 3);
    }

    // Tiny flower heads in the meadow.
    function random01(n, seed) {
      const value = Math.sin(n * 127.1 + seed * 311.7) * 43758.5453;
      return value - Math.floor(value);
    }

    const flowerColors = [0xffefb1, 0xffc5c0, 0xd9c5ff, 0xffffff];
    const flowerMesh = new THREE.InstancedMesh(
      new THREE.SphereGeometry(0.075, 6, 5),
      new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.62 }),
      180
    );
    const flowerDummy = new THREE.Object3D();

    for (let i = 0; i < 180; i++) {
      let x = (random01(i, 1) - 0.5) * 96;
      let z = (random01(i, 2) - 0.5) * 96;

      // Leave the main paths and crop rows mostly clear.
      if (Math.abs(x) < 3.2 || Math.abs(z) < 3.1 ||
          (x > 16 && x < 38 && z > 5 && z < 19)) {
        x += x >= 0 ? 4.3 : -4.3;
        z += z >= 0 ? 3.8 : -3.8;
      }

      const size = 0.65 + random01(i, 3) * 0.75;
      flowerDummy.position.set(x, 0.12, z);
      flowerDummy.rotation.set(0, random01(i, 4) * Math.PI, 0);
      flowerDummy.scale.setScalar(size);
      flowerDummy.updateMatrix();
      flowerMesh.setMatrixAt(i, flowerDummy.matrix);
      flowerMesh.setColorAt(i, new THREE.Color(flowerColors[i % flowerColors.length]));
    }

    flowerMesh.instanceMatrix.needsUpdate = true;
    if (flowerMesh.instanceColor) flowerMesh.instanceColor.needsUpdate = true;
    flowerMesh.castShadow = false;
    flowerMesh.receiveShadow = false;
    scene.add(flowerMesh);

    // A few lantern posts along the village paths.
    function createLamp(x, z) {
      const group = new THREE.Group();
      const wood = new THREE.MeshStandardMaterial({ color: 0x65472f, roughness: 0.95 });
      const post = new THREE.Mesh(
        new THREE.CylinderGeometry(0.07, 0.10, 2.35, 7),
        wood
      );
      post.position.y = 1.17;
      post.castShadow = true;
      group.add(post);

      const lantern = new THREE.Mesh(
        new THREE.BoxGeometry(0.42, 0.48, 0.42),
        new THREE.MeshStandardMaterial({
          color: 0xffdfa0,
          emissive: 0x8c5b20,
          emissiveIntensity: 0.45,
          roughness: 0.35
        })
      );
      lantern.position.y = 2.42;
      lantern.castShadow = true;
      group.add(lantern);

      group.position.set(x, 0, z);
      scene.add(group);
    }

    createLamp(-4.2, 2.8);
    createLamp(4.2, -2.8);

    // Clouds are lightweight procedural meshes, not downloaded assets.
    const clouds = [];
    const cloudMaterial = new THREE.MeshBasicMaterial({
      color: 0xffffff,
      transparent: true,
      opacity: 0.82
    });

    function createCloud(x, y, z, size) {
      const cloud = new THREE.Group();
      const puffs = [
        [-0.85, 0.00, 0.00, 1.05],
        [0.00, 0.25, 0.00, 1.28],
        [0.92, 0.02, 0.02, 0.95],
        [0.28, -0.10, 0.12, 0.92]
      ];

      for (const [px, py, pz, puffScale] of puffs) {
        const puff = new THREE.Mesh(
          new THREE.SphereGeometry(1, 14, 10),
          cloudMaterial
        );
        puff.position.set(px * size, py * size, pz * size);
        puff.scale.set(1.2 * size * puffScale, 0.56 * size * puffScale, 0.76 * size * puffScale);
        cloud.add(puff);
      }

      cloud.position.set(x, y, z);
      scene.add(cloud);
      clouds.push(cloud);
    }

    createCloud(-27, 20, -42, 3.1);
    createCloud(20, 23, -50, 2.7);
    createCloud(39, 18, 18, 2.4);

    // Player root, with a lightweight fallback while the animated GLB loads.
    const player = new THREE.Group();
    const avatar = new THREE.Group();
    player.add(avatar);
    scene.add(player);

    function makeFallbackCharacter() {
      const root = new THREE.Group();
      const shirt = new THREE.MeshStandardMaterial({ color: 0x557c63, roughness: 0.82 });
      const trousers = new THREE.MeshStandardMaterial({ color: 0x394d61, roughness: 0.9 });
      const skin = new THREE.MeshStandardMaterial({ color: 0xd8a783, roughness: 0.86 });
      const dark = new THREE.MeshStandardMaterial({ color: 0x24312f, roughness: 0.72 });

      const torso = new THREE.Mesh(new THREE.BoxGeometry(0.58, 0.84, 0.34), shirt);
      torso.position.y = 1.27;
      torso.castShadow = true;
      root.add(torso);

      const head = new THREE.Mesh(new THREE.SphereGeometry(0.255, 14, 12), skin);
      head.position.set(0, 1.94, 0);
      head.castShadow = true;
      root.add(head);

      for (const side of [-1, 1]) {
        const eye = new THREE.Mesh(new THREE.SphereGeometry(0.035, 8, 6), dark);
        eye.position.set(side * 0.09, 1.98, -0.229);
        root.add(eye);
      }

      const leftLeg = new THREE.Group();
      const rightLeg = new THREE.Group();
      leftLeg.position.set(-0.16, 0.82, 0);
      rightLeg.position.set(0.16, 0.82, 0);
      root.add(leftLeg, rightLeg);

      for (const leg of [leftLeg, rightLeg]) {
        const mesh = new THREE.Mesh(
          new THREE.CylinderGeometry(0.12, 0.14, 0.72, 8),
          trousers
        );
        mesh.position.y = -0.36;
        mesh.castShadow = true;
        leg.add(mesh);
      }

      const leftArm = new THREE.Group();
      const rightArm = new THREE.Group();
      leftArm.position.set(-0.36, 1.56, 0);
      rightArm.position.set(0.36, 1.56, 0);
      root.add(leftArm, rightArm);

      for (const arm of [leftArm, rightArm]) {
        const mesh = new THREE.Mesh(
          new THREE.CylinderGeometry(0.085, 0.10, 0.62, 8),
          shirt
        );
        mesh.position.y = -0.29;
        mesh.castShadow = true;
        arm.add(mesh);
      }

      return { root, leftLeg, rightLeg, leftArm, rightArm };
    }

    let fallbackRig = makeFallbackCharacter();
    avatar.add(fallbackRig.root);

    const keys = new Set();
    const blockers = houseBlockers;

    let cameraYaw = 0;
    let isDragging = false;
    let lastPointerX = 0;

    const velocity = new THREE.Vector3();
    const forward = new THREE.Vector3();
    const right = new THREE.Vector3();
    const desiredVelocity = new THREE.Vector3();
    const cameraGoal = new THREE.Vector3();
    const cameraFocus = new THREE.Vector3();

    function keyIsDown(...codes) {
      return codes.some(code => keys.has(code));
    }

    function isBlocked(x, z) {
      if (Math.abs(x) > 58 || Math.abs(z) > 58) return true;

      for (const b of blockers) {
        if (Math.abs(x - b.x) < b.rx && Math.abs(z - b.z) < b.rz) {
          return true;
        }
      }
      return false;
    }

    function updatePlayer(dt) {
      const forwardInput =
        (keyIsDown("KeyW", "ArrowUp") ? 1 : 0) -
        (keyIsDown("KeyS", "ArrowDown") ? 1 : 0);

      const sideInput =
        (keyIsDown("KeyD", "ArrowRight") ? 1 : 0) -
        (keyIsDown("KeyA", "ArrowLeft") ? 1 : 0);

      const sprinting = keyIsDown("ShiftLeft", "ShiftRight");

      forward.set(-Math.sin(cameraYaw), 0, -Math.cos(cameraYaw));
      right.set(Math.cos(cameraYaw), 0, -Math.sin(cameraYaw));

      desiredVelocity.set(0, 0, 0);
      desiredVelocity.addScaledVector(forward, forwardInput);
      desiredVelocity.addScaledVector(right, sideInput);

      const hasInput = desiredVelocity.lengthSq() > 0.001;
      if (hasInput) desiredVelocity.normalize();

      const targetSpeed = sprinting ? 7.5 : 4.4;
      desiredVelocity.multiplyScalar(hasInput ? targetSpeed : 0);

      const response = 1 - Math.exp(-(hasInput ? 10 : 7) * dt);
      velocity.x += (desiredVelocity.x - velocity.x) * response;
      velocity.z += (desiredVelocity.z - velocity.z) * response;

      const nextX = player.position.x + velocity.x * dt;
      if (isBlocked(nextX, player.position.z)) velocity.x = 0;
      else player.position.x = nextX;

      const nextZ = player.position.z + velocity.z * dt;
      if (isBlocked(player.position.x, nextZ)) velocity.z = 0;
      else player.position.z = nextZ;

      const speed = Math.hypot(velocity.x, velocity.z);
      const moving = speed > 0.35;
      const actuallySprinting = moving && sprinting;

      if (moving) {
        const targetYaw = Math.atan2(velocity.x, -velocity.z);
        const yawDelta = Math.atan2(
          Math.sin(targetYaw - player.rotation.y),
          Math.cos(targetYaw - player.rotation.y)
        );
        player.rotation.y += yawDelta * (1 - Math.exp(-12 * dt));
      }

      if (fallbackRig) {
        const phase = performance.now() * 0.001 * (actuallySprinting ? 12 : 8);
        const swing = moving ? Math.sin(phase) * (actuallySprinting ? 0.62 : 0.43) : 0.025;
        fallbackRig.leftLeg.rotation.x = swing;
        fallbackRig.rightLeg.rotation.x = -swing;
        fallbackRig.leftArm.rotation.x = -swing * 0.72;
        fallbackRig.rightArm.rotation.x = swing * 0.72;
        fallbackRig.root.position.y = moving ? Math.abs(Math.sin(phase)) * 0.035 : 0;
      }

      return { moving, sprinting: actuallySprinting, speed };
    }

    let mixer = null;
    let idleAction = null;
    let walkAction = null;
    let runAction = null;
    let activeAction = null;
    let avatarHasNativeAnimation = false;

    function configureAnimations(root, clips) {
      if (!clips || clips.length === 0) return;

      mixer = new THREE.AnimationMixer(root);

      const idleClip = clips.find(clip => /idle|stand|rest|breath/i.test(clip.name));
      const walkClip = clips.find(clip => /walk|locomotion|move/i.test(clip.name));
      const runClip = clips.find(clip => /run|sprint|jog/i.test(clip.name));

      const actionCache = new Map();
      const makeAction = clip => {
        if (!clip) return null;
        if (!actionCache.has(clip)) {
          const action = mixer.clipAction(clip);
          action.setLoop(THREE.LoopRepeat, Infinity);
          actionCache.set(clip, action);
        }
        return actionCache.get(clip);
      };

      idleAction = makeAction(idleClip);

      let chosenWalk = walkClip;
      if (!chosenWalk && runClip) chosenWalk = runClip;
      if (!chosenWalk && clips.length) {
        chosenWalk = clips.find(clip => clip !== idleClip) || null;
      }
      if (!chosenWalk && !idleClip && clips.length) chosenWalk = clips[0];

      walkAction = makeAction(chosenWalk);
      runAction = makeAction(runClip) || walkAction;
      avatarHasNativeAnimation = Boolean(idleAction || walkAction);

      if (idleAction) {
        idleAction.play();
        activeAction = idleAction;
      }
    }

    function switchAnimation(nextAction) {
      if (activeAction === nextAction) return;

      if (nextAction) {
        nextAction.reset();
        nextAction.fadeIn(0.2);
        nextAction.play();
      }
      if (activeAction) activeAction.fadeOut(0.2);
      activeAction = nextAction;
    }

    function updateAnimations(dt, state, elapsed) {
      if (mixer) {
        const wanted = state.moving
          ? (state.sprinting ? (runAction || walkAction) : (walkAction || runAction))
          : idleAction;

        switchAnimation(wanted);
        if (walkAction) walkAction.timeScale = 1;
        if (runAction && runAction !== walkAction) {
          runAction.timeScale = state.sprinting ? 1.22 : 1;
        }
        mixer.update(dt);
      }

      if (!avatarHasNativeAnimation && !fallbackRig) {
        avatar.position.y = state.moving ? Math.sin(elapsed * 12) * 0.025 : 0;
      }
    }

    const loader = new GLTFLoader();
    loader.setCrossOrigin("anonymous");

    const ASSET_COUNT = 4;
    let assetsFinished = 0;
    let assetsFailed = 0;

    function finishAsset(label, success) {
      assetsFinished += 1;
      if (!success) assetsFailed += 1;

      const progress = Math.round((assetsFinished / ASSET_COUNT) * 100);
      document.getElementById("progressBar").style.width = progress + "%";

      if (assetsFinished < ASSET_COUNT) {
        document.getElementById("loadTitle").textContent =
          "Streaming village models…";
        document.getElementById("loadDetail").textContent =
          `${assetsFinished} of ${ASSET_COUNT} model files finished`;
      } else {
        document.getElementById("loadTitle").textContent =
          assetsFailed === 0 ? "Village ready — all models loaded" : "Village ready — fallback scenery active";
        document.getElementById("loadDetail").textContent =
          `${ASSET_COUNT - assetsFailed} of ${ASSET_COUNT} models loaded`;
        worldStatus.textContent =
          assetsFailed === 0 ? "VILLAGE READY" : "VILLAGE READY · FALLBACKS ON";
        window.setTimeout(() => {
          document.getElementById("loaderCard").classList.add("fade");
        }, 950);
      }
    }

    function loadAsset(label, url, onLoaded) {
      try {
        loader.load(
          url,
          gltf => {
            try {
              onLoaded(gltf);
              finishAsset(label, true);
            } catch (error) {
              console.error(`Could not place ${label}:`, error);
              finishAsset(label, false);
            }
          },
          event => {
            if (event.lengthComputable) {
              const percent = Math.round((event.loaded / event.total) * 100);
              document.getElementById("loadDetail").textContent =
                `${label}: ${percent}%`;
            }
          },
          error => {
            console.warn(`Could not load ${label} from GitHub Raw:`, error);
            finishAsset(label, false);
          }
        );
      } catch (error) {
        console.warn(`Could not start loading ${label}:`, error);
        finishAsset(label, false);
      }
    }

    function prepareModel(root) {
      root.traverse(node => {
        if (node.isMesh) {
          node.castShadow = true;
          node.receiveShadow = true;
        }
      });
    }

    function fitToHeight(root, targetHeight) {
      root.position.set(0, 0, 0);
      root.updateMatrixWorld(true);

      const bounds = new THREE.Box3().setFromObject(root);
      const size = bounds.getSize(new THREE.Vector3());
      if (!Number.isFinite(size.y) || size.y < 0.001) return;

      const center = bounds.getCenter(new THREE.Vector3());
      const factor = targetHeight / size.y;

      root.scale.multiplyScalar(factor);
      root.position.set(
        -center.x * factor,
        -bounds.min.y * factor,
        -center.z * factor
      );
      root.updateMatrixWorld(true);
    }

    function placeProp(gltf, targetHeight, x, z, rotation = 0) {
      const root = gltf.scene || gltf.scenes[0];
      prepareModel(root);
      fitToHeight(root, targetHeight);
      root.position.x += x;
      root.position.z += z;
      root.rotation.y = rotation;
      scene.add(root);
      return root;
    }

    // Load the player character; the procedural character remains if the URL fails.
    loadAsset("character", ASSETS.character, gltf => {
      const model = gltf.scene || gltf.scenes[0];
      prepareModel(model);
      fitToHeight(model, 2.05);

      if (fallbackRig) {
        avatar.remove(fallbackRig.root);
        fallbackRig = null;
      }

      avatar.add(model);
      avatar.rotation.y = CHARACTER_YAW_OFFSET;
      configureAnimations(model, gltf.animations || []);
    });

    // Farm props use repository Raw URLs. The rest of the village is procedural.
    loadAsset("barn", ASSETS.barn, gltf => {
      placeProp(gltf, 7.2, 27, -15, Math.PI * 0.5);
    });

    loadAsset("windmill", ASSETS.windmill, gltf => {
      placeProp(gltf, 10.5, -27, -16, 0);
    });

    loadAsset("tree", ASSETS.tree, gltf => {
      const template = gltf.scene || gltf.scenes[0];
      prepareModel(template);
      fitToHeight(template, 8.0);
      const fittedOffset = template.position.clone();

      const placements = [
        [34, -8, 0.2],
        [-35, 8, 1.1],
        [4, -39, 2.2],
        [39, 20, 0.7]
      ];

      for (const [x, z, rotation] of placements) {
        const copy = template.clone(true);
        copy.position.copy(fittedOffset).add(new THREE.Vector3(x, 0, z));
        copy.rotation.y = rotation;
        prepareModel(copy);
        scene.add(copy);
      }
    });

    // Keyboard controls.
    const movementKeys = new Set([
      "KeyW", "KeyA", "KeyS", "KeyD",
      "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight",
      "ShiftLeft", "ShiftRight"
    ]);

    window.addEventListener("keydown", event => {
      if (movementKeys.has(event.code)) {
        event.preventDefault();
        keys.add(event.code);
      }
    });

    window.addEventListener("keyup", event => {
      keys.delete(event.code);
    });

    window.addEventListener("blur", () => keys.clear());

    // Touch buttons use the same movement code as WASD.
    document.querySelectorAll(".touch-key[data-key]").forEach(button => {
      const key = button.dataset.key;

      const release = () => {
        keys.delete(key);
        button.classList.remove("pressed");
      };

      button.addEventListener("pointerdown", event => {
        event.preventDefault();
        keys.add(key);
        button.classList.add("pressed");
        button.setPointerCapture(event.pointerId);
      });
      button.addEventListener("pointerup", release);
      button.addEventListener("pointercancel", release);
      button.addEventListener("lostpointercapture", release);
    });

    // Drag on the canvas to orbit the third-person camera.
    renderer.domElement.addEventListener("pointerdown", event => {
      if (event.button !== 0) return;
      isDragging = true;
      lastPointerX = event.clientX;
      renderer.domElement.setPointerCapture(event.pointerId);
    });

    renderer.domElement.addEventListener("pointermove", event => {
      if (!isDragging) return;
      const deltaX = event.clientX - lastPointerX;
      lastPointerX = event.clientX;
      cameraYaw -= deltaX * 0.005;
    });

    const stopDragging = () => { isDragging = false; };
    renderer.domElement.addEventListener("pointerup", stopDragging);
    renderer.domElement.addEventListener("pointercancel", stopDragging);
    renderer.domElement.addEventListener("contextmenu", event => event.preventDefault());

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const clock = new THREE.Clock();
    let lastHudUpdate = 0;

    function animate() {
      requestAnimationFrame(animate);

      const dt = Math.min(clock.getDelta(), 0.05);
      const state = updatePlayer(dt);
      const elapsed = clock.elapsedTime;

      updateAnimations(dt, state, elapsed);

      for (const cloud of clouds) {
        cloud.position.x += dt * 0.22;
        if (cloud.position.x > 57) cloud.position.x = -57;
      }

      cameraGoal.set(
        player.position.x + Math.sin(cameraYaw) * 11.5,
        player.position.y + 7.0,
        player.position.z + Math.cos(cameraYaw) * 11.5
      );
      camera.position.lerp(cameraGoal, 1 - Math.exp(-5.5 * dt));

      cameraFocus.set(player.position.x, player.position.y + 1.0, player.position.z);
      camera.lookAt(cameraFocus);

      if (elapsed - lastHudUpdate > 0.12) {
        lastHudUpdate = elapsed;
        activityLabel.textContent = state.sprinting
          ? "SPRINTING"
          : state.moving
            ? "WALKING THE VILLAGE"
            : "READY TO EXPLORE";

        coordsLabel.textContent =
          `VILLAGE SQUARE · ${Math.round(player.position.x)}, ${Math.round(player.position.z)}`;
      }

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
